<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   EMBER BLADES — stickman saber duel.  Single file, no assets.
   Sections: CORE · INPUT · AUDIO · ANIMATION · VFX · CAMERA · FIGHTER ·
             COMBAT · AI · ARENAS/RENDERER · UI · GAME FLOW · MAIN LOOP
   ===================================================================== */

/* ============================== CORE ================================ */
const PI = Math.PI, TAU = PI * 2;

  lin: t => t,
  in: t => t * t * t,
  out: t => 1 - (1 - t) * (1 - t) * (1 - t),

// Persistent settings / unlocks (never throws)
const SAVE_KEY = 'emberblades.v1';
const SET = { vol: 0.7, mute: false, quality: 'auto', scan: false, shake: true, touch: 'auto', unlocks: 0, bestStory: 0 };
function loadSave() { try { const o = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); for (const k in SET) if (typeof o[k] === typeof SET[k]) SET[k] = o[k]; } catch (e) { /* storage unavailable */ } }

loadSave();
const URLQ = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new Map(); } })();
if (URLQ.get('q')) SET.quality = URLQ.get('q');

// Canvas + virtual resolution. Height is 720 virtual px on landscape screens.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });

const Q = { level: 0, scale: 1, bloom: true, haze: true, refl: true, part: 1, grain: true };
function applyQuality() {
  // 0 = everything, 1 = no heat haze, 2 = no bloom, 3 = low resolution and half the particles
  const q = SET.quality === 'auto' ? Q.level : SET.quality === 'high' ? 0 : SET.quality === 'medium' ? 2 : 3;
  Q.scale = [1, .85, .75, .6][q]; Q.bloom = q < 2; Q.haze = q < 1; Q.refl = true; Q.part = [1, .8, .6, .45][q]; Q.grain = q < 3; Q.cur = q;
}
const resizeHooks = [];
function resize() {
  const w = Math.max(320, innerWidth), h = Math.max(240, innerHeight), asp = w / h;
  if (asp >= 4 / 3) { VH = 720; VW = Math.round(720 * asp); } else { VW = 960; VH = Math.round(960 / asp); }
  applyQuality();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pxW = Math.min(w * dpr, 1920) * Q.scale;
  S = pxW / VW;
  cv.width = Math.round(VW * S); cv.height = Math.round(VH * S);

}
addEventListener('resize', resize);
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

/* ============================== INPUT =============================== */

const keys = Object.create(null);

    case 'ArrowDown': case 'KeyS': menuQ.push('down'); break;
    case 'ArrowLeft': case 'KeyA': menuQ.push('left'); break;
    case 'ArrowRight': case 'KeyD': menuQ.push('right'); break;
    case 'Enter': case 'Space': case 'KeyJ': case 'NumpadEnter': menuQ.push('ok'); break;
    case 'Escape': menuQ.push('pause'); break;
    case 'Backspace': case 'KeyK': menuQ.push('back'); break;
    case 'F1': DBG.on = !DBG.on; break;
    case 'KeyM': SET.mute = !SET.mute; AU.applyVol(); storeSave(); break;

    case 'KeyH': menuQ.push('hitbox'); break;
    case 'KeyT': menuQ.push('dummy'); break;

addEventListener('keyup', e => { keys[e.code] = 0; });
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; menuQ.push('blur'); });

// Pointer: menus are clickable/tappable, touch buttons drive pad 1
const pointer = { x: 0, y: 0, down: false, tap: false };

  onFirstInput(); const [x, y] = ptPos(e);
  if (e.pointerType === 'touch') { touchSeen = true; touch.pts.set(e.pointerId, [x, y]); }

cv.addEventListener('contextmenu', e => e.preventDefault());
function showTouch() { return SET.touch === 'on' || (SET.touch === 'auto' && touchSeen); }
function layoutTouch() {

  b.push({ i: B.L, x: lx - r * 1.5, y: by, r, t: '◀' }, { i: B.R, x: lx + r * 1.5, y: by, r, t: '▶' }, { i: B.U, x: lx, y: by - r * 1.5, r, t: '▲' }, { i: B.D, x: lx, y: by + r * 1.5, r, t: '▼' });

  b.push({ i: B.LIGHT, x: rx - r * 2.3, y: by + r * .9, r, t: 'LIGHT' }, { i: B.HEAVY, x: rx - r * .1, y: by + r * .9, r, t: 'HEAVY' },
    { i: B.BLOCK, x: rx - r * 3.4, y: by - r * 1.2, r, t: 'BLOCK' }, { i: B.FORCE, x: rx - r * 1.2, y: by - r * 1.2, r, t: 'FORCE' },
    { i: B.DASH, x: rx - r * 2.3, y: by - r * 3.3, r: r * .85, t: 'DASH' }, { i: B.ULT, x: rx - r * .1, y: by - r * 3.3, r: r * .85, t: 'ULT' });

resizeHooks.push(layoutTouch);

  touch.raw.fill(0);

const gpPrev = [new Uint8Array(20), new Uint8Array(20)];
const gpRaw = [new Uint8Array(NB), new Uint8Array(NB)];

  gpRaw[0].fill(0); gpRaw[1].fill(0);
  let pads; try { pads = navigator.getGamepads ? navigator.getGamepads() : null; } catch (e) { pads = null; }
  if (!pads) return;

  for (let k = 0; k < pads.length && n < 2; k++) {
    const g = pads[k]; if (!g || !g.connected) continue;
    const raw = gpRaw[n], pv = gpPrev[n];
    for (const m of GMAP) if (g.buttons[m[0]] && g.buttons[m[0]].pressed) raw[m[1]] = 1;
    const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    if (ax < -.4) raw[0] = 1; if (ax > .4) raw[1] = 1; if (ay < -.6) raw[2] = 1; if (ay > .55) raw[3] = 1;
    // menu edges
    const cur = [raw[2], raw[3], raw[0], raw[1], g.buttons[0] && g.buttons[0].pressed ? 1 : 0, g.buttons[1] && g.buttons[1].pressed ? 1 : 0, g.buttons[9] && g.buttons[9].pressed ? 1 : 0];
    const ev = ['up', 'down', 'left', 'right', 'ok', 'back', 'pause'];
    for (let i = 0; i < 7; i++) { if (cur[i] && !pv[i]) { menuQ.push(ev[i]); onFirstInput(); } pv[i] = cur[i]; }
    n++;
  }

const pads = [new Pad(), new Pad()];
// Gather raw states for a human-controlled pad (called once per sim tick)
function feedHuman(pi, single) {
  const raw = pads[pi].raw; raw.fill(0);
  const m = pi === 0 ? KMAP1 : KMAP2;
  for (const k in m) if (keys[k]) raw[m[k]] = 1;
  if (single && pi === 0) { for (const k in KMAP2) if (keys[k]) raw[KMAP2[k]] = 1; }   // solo: both layouts work

}
const DBG = { on: !!URLQ.get('debug'), fps: 60, ms: 0, hit: false };

/* ============================== AUDIO ===============================
   Everything is synthesised with WebAudio: no files. */
const AU = {
  ctx: null, master: null, sfx: null, mus: null, noise: null, brown: null, hums: [], zap: null, rumble: null,
  nextBeat: 0, step: 0, intensity: 0.2, chordI: 0, started: false,
  unlock() {

      this.mus = c.createGain(); this.mus.gain.value = .5; this.mus.connect(this.master);

      const w = wb.getChannelData(0), b = bb.getChannelData(0); let last = 0;

      this.rumble = c.createGain(); this.rumble.gain.value = 0; rs.connect(rf); rf.connect(this.rumble); this.rumble.connect(this.master); rs.start();

        o1.type = 'sawtooth'; o2.type = 'sawtooth'; o3.type = 'square'; o1.frequency.value = 92 + i * 6; o2.frequency.value = 93.4 + i * 6; o3.frequency.value = 46 + i * 3;
        f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 2; lfo.frequency.value = 27 + i * 3; lg.gain.value = .25; g.gain.value = 0;
        const pre = c.createGain(); pre.gain.value = .5; lfo.connect(lg); lg.connect(pre.gain);

      const f2 = c.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 1150; f2.Q.value = 4;
      const f3 = c.createBiquadFilter(); f3.type = 'lowpass'; f3.frequency.value = 380;
      this.padIn = c.createGain(); this.padIn.connect(f1); this.padIn.connect(f2); this.padIn.connect(f3); f1.connect(this.padBus); f2.connect(this.padBus); f3.connect(this.padBus); this.padBus.connect(this.mus);
      const d1 = c.createOscillator(), d2 = c.createOscillator(), df = c.createBiquadFilter(); this.drone = c.createGain(); this.drone.gain.value = 0;

  t() { return this.ctx.currentTime; },
  // --- primitive voices ---
  nz(dur, type, f0, f1, vol, q, when, bus) {
